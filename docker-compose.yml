version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: finora-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - finora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finora-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:admin@mongodb:27017/finora?authSource=admin
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - finora-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finora-client
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - finora-network

volumes:
  mongodb_data:

networks:
  finora-network:
    driver: bridge
